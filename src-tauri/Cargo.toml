[package]
name = "prompt-checker"
description = "Collects your Claude Code and Codex CLI prompts and reviews how well you prompt"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "prompt_checker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
pc-core = { path = "../crates/core" }
