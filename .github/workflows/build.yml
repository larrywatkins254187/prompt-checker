name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  # Actions tab -> Build -> Run workflow. With a version (e.g. 0.3.0) it publishes a release;
  # empty just builds a test installer.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.3.0 (empty = test build only)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  test:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: cargo test -p pc-core

  # Every push: an unsigned installer to try out (no auto-update metadata).
  windows:
    name: Windows installer
    if: ${{ !startsWith(github.ref, 'refs/tags/v') && !inputs.version }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Core tests on Windows
        run: cargo test -p pc-core
      - name: Build installer
        run: npx tauri build --config src-tauri/tauri.no-updater.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: prompt-checker-windows
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # Tag v1.2.3 (or Run workflow with a version): signed build published as a GitHub
  # release, with latest.json for auto-update.
  release:
    name: Release
    if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.version }}
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check signing key
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Repository secret TAURI_SIGNING_PRIVATE_KEY is missing (see README, 'Publishing updates')."
            exit 1
          fi
      - name: Use the tag / input as the app version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then VERSION="${INPUT_VERSION#v}"; else VERSION="${GITHUB_REF_NAME#v}"; fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.2.3, got '$VERSION'"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          node -e "const fs=require('fs');const f='src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(f,'utf8'));c.version=process.argv[1];fs.writeFileSync(f,JSON.stringify(c,null,2)+'\n')" "$VERSION"
          echo "Building version $VERSION"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: v${{ steps.version.outputs.version }}
          releaseName: Prompt Checker v${{ steps.version.outputs.version }}
          releaseCommitish: ${{ github.sha }}
          releaseBody: "Install with the -setup.exe below. Installed copies update themselves automatically."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
